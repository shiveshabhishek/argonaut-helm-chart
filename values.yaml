
LOG_LEVEL: INFO
# OPTIONAL no need to setup git unless you want to use it
GIT:
  enabled: false
  GIT_USER_EMAIL: xxxxxxxxxxxxxxxxxxxxxxx
  GIT_USER_NAME: xxxxxxxxxxxxxxxxxxxxxxxxx
  secretName: ""
# set to true of you want Argonaut to run command automatically
AUTO_RUN: false

# choose file_stroage or elasticsearch storage , not both
STORAGE_BACKENDS: file_storage
FILE_STORAGE:
  enabled: true
  FS_INDEX: /argonaut/file_storage
elasticsearch:
  enabled: false
#only if enabled is true set below fields
  ES_EXT_URL: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  ES_URL: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  es_ca_certs: xxxxxxxxxxxxxxxxxxxxxxxxxxx
  es_index: xxxxxxxxxxxxxxxxxxxxxxxxxxxxx
#create a secret kubectl -n <NS> create secret generic <secretName> --from-literal username=elastic --from-literal  password=xyz
  secretName: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
slack:
  enabled: false
  slack_auth_url: https://slack.com/api/auth.test
  slack_post_url: https://slack.com/api/chat.postMessage
#only if enabled is true
#create a secret kubectl -n <NS> create secret generic <secretName> --from-literal  SLACK_BOT_TOKEN=xoxb-123 --from-literal SLACK_SIGNING_SECRET=xyz
  secretName: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
openAI:
  enabled: false
#create a secret kubectl -n <NS> create secret generic open-api-key --from-literal  --OPENAI_API_KEY=xoxb-123
  secretName: ""
  MAX_USER_INPUT_TOKENS: "6000"
  SAVE_TOKEN_USE_SUMMARY: "true"
  max_response_tokens: "500"
  model: gpt-4o
  temperature: "0.0"
  top_p: "0.5"
# OPtional if you use argocd login argocdUrl --core
argocd:
  usecreds: false
#OPTIONAL add only if above is true. If false set the service account create to false and the name is set to argocd-application-controller
#create a secret kubectl -n <NS> create secret generic argocd-for-slack --from-literal  argocdUrl=example.com --from-literal argocdUsername=someuser --from-literal --argocdPassword=somepassword
  secretName: ""
#OPTIONAL add only if you use
kubernetes:
  enabled: false
#only if enabled is true
#create a secret kubectl -n <NS> create secret generic kubeconfigs --from-file  in-cluster=<kubeconfig-forfile>
  secretName: kubeconfigs

# Optional spincli integration
spincli:
  enabled: false
  secretName: ""

# Default values for argonaut.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: docker.io/gopalvithaljayanthi/argonaut
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

#This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "slack-bot"

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/ 
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80
# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
  className: "nginx"
  annotations: 
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: argonaut.opencd.opsmx.org
      paths:
        - path: /
          pathType: Prefix
  tls: 
    - secretName: chart-example-tls
      hosts:
        - argonaut.opencd.opsmx.org


########################### NOT IMPLEMENTED **************
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

#This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

extraVolumeMounts: []
extraVolumes: []

#examples:
# extraVolumes:
#   - name: aws-creds
#     secret:
#       secretName: aws-creds

# extraVolumeMounts:
