{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
  labels:
    app.kubernetes.io/name: {{ include "argonaut.fullname" . }}
  name: {{ include "argonaut.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "argonaut.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "argonaut.fullname" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
