{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  labels:
    app.kubernetes.io/name: {{ include "argonaut.fullname" . }}
  name: {{ include "argonaut.fullname" . }}
{{- end }}
